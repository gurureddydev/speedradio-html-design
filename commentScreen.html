<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Comments Screen</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
      background: #202020;
      font-family: 'DM Sans', sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
    }

    .phone {
      width: 100%;
      max-width: 420px;
      height: 100%;
      background: #202020;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Now playing ───────────────────────────────────────── */
    .now-playing {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 5px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: fixed;
      width: calc(100% - 32px);
      max-width: 388px;
      height: 72px;
      left: 50%;
      top: 54px;
      transform: translateX(-50%);
      z-index: 20;
      overflow: hidden;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.12);
    }

    .np-thumb {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      background: #333;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .np-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .np-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .np-title {
      color: #CF4339;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .np-author {
      color: rgba(255, 255, 255, 0.6);
      font-size: 12px;
      font-weight: 500;
    }

    .np-play-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #EA1C25;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      cursor: pointer;
    }

    .np-replay-btn {
      width: 28px;
      height: 28px;
      background: none;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      cursor: pointer;
      opacity: 0.75;
      padding: 0;
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .np-replay-btn:active {
      opacity: 1;
      transform: rotate(-30deg) scale(0.9);
    }

    .np-replay-btn img {
      width: 20px;
      height: 20px;
      object-fit: contain;
      pointer-events: none;
    }

    .np-progress {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 4px;
      background: rgba(255, 255, 255, 0.15);
    }

    .np-progress-fill {
      height: 100%;
      width: 55%;
      background: rgba(207, 67, 57, 0.9);
      border-radius: 0 0 0 5px;
    }

    /* ── Comment sheet ─────────────────────────────────────── */
    /*
     * The sheet is always full-screen (top: 0 → bottom: 0).
     * The now-playing bar floats above it (z-index: 20 vs z-index: 10).
     *
     * KEY FIX: instead of `padding-top` on the scroll container (which
     * only pushes the first item and lets scrolled content bleed under
     * the player), we insert a real .sheet-spacer DOM element ABOVE the
     * scroll container. The scroll container then starts at 96px — the
     * exact bottom edge of the now-playing bar — so scrolled content
     * clips there and never leaks behind the player.
     *
     * Heights (in-browser, env(safe-area-inset-top) ≈ 0, fallback 8px):
     *   modal padding-top : 8px
     *   drag handle zone  : 6 + 5 + 14 = 25px
     *   now-playing bottom: top(24) + height(72) = 96px
     *   spacer needed     : 96 − 8 − 25 = 63px
     */
    .comment-modal {
      background: #1C1C1E;
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-width: 420px;
      position: fixed;
      left: 50%;
      top: 0;
      bottom: 0;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding-top: env(safe-area-inset-top, 8px);
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.45);
    }

    /* Drag handle */
    .drag-handle {
      width: 42px;
      height: 5px;
      background: rgba(255, 255, 255, 0.32);
      border-radius: 999px;
      margin: 6px auto 14px;
      flex-shrink: 0;
      margin-top: 20px;
      cursor: grab;
      transition: opacity 0.2s ease;
    }

    .drag-handle:active {
      cursor: grabbing;
      opacity: 0.7;
    }

    /*
     * Spacer — fills the dead zone behind the now-playing bar.
     * The "Responses" title sits at the BOTTOM of this zone so it
     * appears just below the player card as a natural section header.
     */
    .sheet-spacer {
      /* 63px = 96px (player bottom) − 8px (modal padding) − 25px (handle) */
      height: 63px;
      flex-shrink: 0;
      display: flex;
      align-items: flex-end;
      padding: 0 16px 10px;
    }

    .sheet-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sheet-title-text {
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    .sheet-count-badge {
      background: rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.65);
      font-size: 12px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 99px;
      display: none;
    }

    /*
     * Scroll container — starts at exactly 96px from viewport top,
     * so comments can never visually overlap the now-playing bar.
     */
    .comment-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      padding-top: 12px;
    }

    .comment-list::-webkit-scrollbar {
      display: none;
    }

    /* Empty state */
    .empty-state {
      flex: 1;
      margin: 16px;
      margin-top: 60px;
      background: #1C1C1E;
      border: 1px solid #FFFFFF1A;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .empty-title {
      font-weight: 600;
      font-size: 16px;
      color: #fff;
    }

    .empty-sub {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.6);
    }

    /* ── Comment item ──────────────────────────────────────── */
    .comment-item {
      display: flex;
      align-items: flex-start;
      padding: 24px 14px 0;
      gap: 12px;
      position: relative;
    }

    .c-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      user-select: none;
    }

    .c-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      min-width: 0;
    }

    .c-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .c-left {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .c-header {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .c-name {
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      line-height: 21px;
    }

    .c-time {
      color: rgba(255, 255, 255, 0.5);
      font-size: 12px;
    }

    .c-text {
      color: #fff;
      font-size: 14px;
      line-height: 21px;
      margin-bottom: 8px;
      word-break: break-word;
    }

    .c-mention {
      color: #EA1C25;
      font-weight: 700;
    }

    .c-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .c-action-btn {
      display: flex;
      align-items: center;
      gap: 4px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 12px;
      font-weight: 500;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      font-family: 'DM Sans', sans-serif;
    }

    .c-replies-label {
      color: rgba(255, 255, 255, 0.5);
      font-size: 12px;
      font-weight: 500;
    }

    .c-right {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      min-width: 43px;
    }

    .c-like-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .c-like-icon {
      display: block;
      object-fit: contain;
      opacity: 0.7;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.2s;
    }

    .c-like-btn.liked .c-like-icon {
      opacity: 1;
      transform: scale(1.15);
    }

    @keyframes likePop {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.4);
      }

      100% {
        transform: scale(1.15);
      }
    }

    .c-like-btn.animating .c-like-icon {
      animation: likePop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .c-like-count {
      color: rgba(255, 255, 255, 0.7);
      font-size: 12px;
      font-weight: 500;
      text-align: center;
    }

    /* ── Reply thread ──────────────────────────────────────── */
    .reply-thread {
      display: flex;
      flex-direction: column;
      margin-top: 8px;
    }

    .reply-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 0 0;
      position: relative;
    }

    .reply-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      user-select: none;
    }

    .reply-body {
      flex: 1;
      min-width: 0;
    }

    .reply-header {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 2px;
    }

    .reply-name {
      color: #fff;
      font-size: 13px;
      font-weight: 700;
    }

    .reply-time {
      color: rgba(255, 255, 255, 0.5);
      font-size: 11px;
    }

    .reply-text {
      color: #fff;
      font-size: 13px;
      line-height: 20px;
      margin-bottom: 6px;
      word-break: break-word;
    }

    .reply-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .reply-right {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      min-width: 43px;
    }

    .reply-like-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .reply-like-count {
      color: rgba(255, 255, 255, 0.7);
      font-size: 11px;
      font-weight: 500;
      text-align: center;
    }

    /* ── Context menu ──────────────────────────────────────── */
    .ctx-menu {
      position: fixed;
      width: 131px;
      background: #242424;
      border-radius: 15px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 16px;
      z-index: 201;
      box-shadow: 0px 5px 9.8px rgba(0, 0, 0, 0.6);
    }

    .ctx-item {
      width: 100%;
      height: 32px;
      border: none;
      background: transparent;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      padding: 0;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      font-size: 16px;
      line-height: 21px;
      color: #FFFFFF;
    }

    .ctx-item.danger {
      color: #FF2D2D;
    }

    /* ── Mention popup ─────────────────────────────────────── */
    .mention-popup {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      box-sizing: border-box;
      width: calc(100% - 12px);
      max-width: 378px;
      background: #1C1C1E;
      border: 1px solid #242424;
      border-radius: 15px;
      padding: 12px;
      display: none;
      flex-direction: column;
      align-items: flex-start;
      gap: 16px;
      z-index: 150;
      box-shadow: 0px 5px 9.8px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      animation: mentionPopupIn 0.16s ease-out;
    }

    @keyframes mentionPopupIn {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(8px) scale(0.98);
      }

      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0) scale(1);
      }
    }

    .mention-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      background: transparent;
      border: none;
      padding: 0;
      cursor: pointer;
      text-align: left;
      flex-shrink: 0;
      transition: transform 0.14s ease, opacity 0.14s ease;
    }

    .mention-item:active {
      transform: scale(0.985);
      opacity: 0.82;
    }

    .mention-av {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      flex-shrink: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #333;
      font-size: 14px;
      font-weight: 700;
      color: #fff;
    }

    .mention-av img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .mention-info {
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
      flex: 1;
    }

    .mention-name {
      color: #FFFFFF;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 700;
      line-height: 20px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mention-uname {
      color: rgba(255, 255, 255, 0.68);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      line-height: 18px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Toast ─────────────────────────────────────────────── */
    .toast {
      position: fixed;
      top: 52px;
      left: 50%;
      transform: translateX(-50%) translateY(-110%);
      width: calc(100% - 12px);
      max-width: 384px;
      height: 63px;
      background: #242424;
      border-radius: 5px;
      padding: 10px;
      gap: 10px;
      display: flex;
      flex-direction: row;
      align-items: center;
      z-index: 300;
      opacity: 0;
      transition: opacity 0.22s ease, transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast-divider {
      width: 1px;
      height: 100%;
      background: rgba(255, 255, 255, 0.15);
      flex-shrink: 0;
    }

    .toast span {
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      font-family: 'DM Sans', sans-serif;
      line-height: 1.4;
    }

    /* ── Emoji bar ─────────────────────────────────────────── */
    .emoji-bar {
      background: #242424;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding: 8px 24px;
      height: 48px;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .emoji-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      padding: 0;
      background: none;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.15s ease;
      overflow: hidden;
    }

    .emoji-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      pointer-events: none;
    }

    .emoji-btn:active {
      transform: scale(0.88);
    }

    /* ── Input bar ─────────────────────────────────────────── */
    .input-bar {
      background: #242424;
      padding: 13px 20px calc(16px + env(safe-area-inset-bottom, 0px));
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .input-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #4A4A6A;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      user-select: none;
    }

    .input-box {
      flex: 1;
      display: flex;
      align-items: center;
      background: #242424;
      border: 1px solid #696969;
      border-radius: 15px;
      padding: 8px 4px;
      height: 40px;
      gap: 8px;
    }

    .editor {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      line-height: 1.5;
      max-height: 72px;
      overflow-y: auto;
      word-break: break-word;
      scrollbar-width: none;
      cursor: text;
    }

    .editor::-webkit-scrollbar {
      display: none;
    }

    .editor:empty::before {
      content: attr(data-placeholder);
      color: rgba(255, 255, 255, 0.5);
      pointer-events: none;
    }

    .inline-emoji {
      width: 20px;
      height: 20px;
      vertical-align: -4px;
      object-fit: contain;
      display: inline-block;
      margin: 0 2px;
    }

    .send-btn {
      width: 32px;
      height: 32px;
      border: none;
      background: none;
      padding: 4px;
      gap: 10px;
      border-radius: 10px;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.7);
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .send-btn.visible {
      opacity: 1;
      pointer-events: all;
      transform: scale(1);
    }

    .send-btn img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    .send-btn:active {
      transform: scale(0.88);
    }
  </style>
</head>

<body>
  <div class="phone">

    <!-- Now Playing — fixed above sheet (z-index: 20) -->
    <div class="now-playing" onclick="try{window.parent.closeComments()}catch(e){}" style="cursor:pointer;">
      <div class="np-thumb">
        <img src="assets/poster_img.png" alt="Poster" />
      </div>
      <div class="np-info">
        <div class="np-title">Affirmation For Confidence And Mag...</div>
        <div class="np-author">John Smith</div>
      </div>
      <button class="np-play-btn" onclick="event.stopPropagation()">
        <svg width="12" height="14" viewBox="0 0 12 14" fill="none">
          <rect x="0" y="0" width="4" height="14" rx="1" fill="#fff" />
          <rect x="8" y="0" width="4" height="14" rx="1" fill="#fff" />
        </svg>
      </button>
      <div class="np-progress">
        <div class="np-progress-fill"></div>
      </div>
    </div>

    <!-- Comment sheet — full screen, z-index: 10 -->
    <div class="comment-modal" id="commentModal">
      <!-- Drag handle — sits above the now-playing card -->
      <div class="drag-handle" id="dragHandle"></div>

      <!--
        Sheet spacer — physically occupies the space behind the now-playing bar.
        The scroll container starts AFTER this element, meaning scrolled comments
        can never rise above the player bar. This is the core fix.
      -->
      <div class="sheet-spacer">
        <div class="sheet-title-row">
          <span class="sheet-title-text"></span>
          <span class="sheet-count-badge" id="commentCount"></span>
        </div>
      </div>

      <!-- Scroll container — starts at ~96px from viewport top (below player) -->
      <div class="comment-list" id="commentList">
        <div class="empty-state" id="emptyState">
          <img src="assets/message_empty.png" alt="" style="width:121px;height:100px;opacity:0.8;" />
          <div class="empty-title">Responses</div>
          <div class="empty-sub">Leave a response</div>
        </div>
      </div>

      <!-- Emoji bar -->
      <div class="emoji-bar">
        <button class="emoji-btn" onclick="insertEmoji('😍','assets/emoji_1.png')"><img src="assets/emoji_1.png"
            alt="😍" /></button>
        <button class="emoji-btn" onclick="insertEmoji('🎧','assets/emoji_2.png')"><img src="assets/emoji_2.png"
            alt="🎧" /></button>
        <button class="emoji-btn" onclick="insertEmoji('😆','assets/emoji_3.png')"><img src="assets/emoji_3.png"
            alt="😆" /></button>
        <button class="emoji-btn" onclick="insertEmoji('🔥','assets/emoji_4.png')"><img src="assets/emoji_4.png"
            alt="🔥" /></button>
        <button class="emoji-btn" onclick="insertEmoji('👏','assets/emoji_5.png')"><img src="assets/emoji_5.png"
            alt="👏" /></button>
      </div>

      <!-- Input bar -->
      <div class="input-bar">
        <div class="input-avatar">DM</div>
        <div class="input-box">
          <div id="commentInput" class="editor" contenteditable="true" role="textbox" data-placeholder="Add response..."
            spellcheck="true"></div>
          <button class="send-btn" id="sendBtn" onclick="submitComment()">
            <img id="sendIcon" src="assets/comment_send_img.png" alt="Send" />
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Mention popup -->
  <div class="mention-popup" id="mentionPopup"></div>

  <!-- Toast -->
  <div class="toast" id="toast">
    <svg width="22" height="22" viewBox="0 0 22 22" fill="none" flex-shrink="0" style="flex-shrink:0;">
      <circle cx="11" cy="11" r="10" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" />
      <path d="M7 11l3 3 5-5" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    <div class="toast-divider"></div>
    <span id="toastMsg">Response deleted</span>
  </div>

  <script>
    'use strict';

    // ── Constants ──────────────────────────────────────────────────────────────
    const ME = { name: 'David Martinez', initials: 'DM', color: '#4A4A6A' };
    const COLORS = ['#5B7FA6', '#6E5A3A', '#5A7355', '#7A4A6B', '#6B4E3D', '#8B5E3C'];
    const MENTION_USERS = [
      { name: 'David Martinez', username: 'David_Martinez', initials: 'DM', color: '#4A4A6A' },
      { name: 'David M', username: 'David_M', initials: 'DM', color: '#5B7FA6' },
      { name: 'David R', username: 'David_RR', initials: 'DR', color: '#5A7355' },
      { name: 'Sarah Johnson', username: 'Sarah_J', initials: 'SJ', color: '#7A4A6B' },
      { name: 'Mike Chen', username: 'Mike_C', initials: 'MC', color: '#6B4E3D' },
    ];

    // ── DOM refs ───────────────────────────────────────────────────────────────
    const editor = document.getElementById('commentInput');
    const commentList = document.getElementById('commentList');
    const emptyState = document.getElementById('emptyState');
    const sendBtn = document.getElementById('sendBtn');
    const mentionPopup = document.getElementById('mentionPopup');
    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toastMsg');
    const countBadge = document.getElementById('commentCount');
    const commentModal = document.getElementById('commentModal');
    const dragHandle = document.getElementById('dragHandle');

    // ── State ──────────────────────────────────────────────────────────────────
    let replyingTo = null;
    let editingTextEl = null;
    let idSeq = 0;

    // ── Comment count ──────────────────────────────────────────────────────────
    function updateCount() {
      const n = commentList.querySelectorAll('.comment-item').length;
      if (n > 0) {
        countBadge.textContent = n;
        countBadge.style.display = '';
      } else {
        countBadge.style.display = 'none';
      }
    }

    // ── Toast ──────────────────────────────────────────────────────────────────
    let toastTimer = null;
    function showToast(msg) {
      toastMsg.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // ── Send button ────────────────────────────────────────────────────────────
    function syncSendBtn() {
      const has = editor.innerText.trim().length > 0 || !!editor.querySelector('img.inline-emoji');
      sendBtn.classList.toggle('visible', has);
    }

    // ── Emoji insertion ────────────────────────────────────────────────────────
    function insertEmoji(alt, src) {
      editor.focus();
      const img = document.createElement('img');
      img.src = src; img.alt = alt; img.className = 'inline-emoji';
      const sel = window.getSelection();
      if (sel && sel.rangeCount > 0) {
        const range = sel.getRangeAt(0);
        if (editor.contains(range.commonAncestorContainer)) {
          range.deleteContents();
          range.insertNode(img);
          range.setStartAfter(img);
          range.collapse(true);
          sel.removeAllRanges();
          sel.addRange(range);
          syncSendBtn();
          return;
        }
      }
      editor.appendChild(img);
      syncSendBtn();
    }

    // ── Sanitise editor content ────────────────────────────────────────────────
    function sanitize(node) {
      const frag = document.createDocumentFragment();
      node.childNodes.forEach(child => {
        if (child.nodeType === Node.TEXT_NODE) {
          frag.appendChild(document.createTextNode(child.textContent));
        } else if (child.nodeType === Node.ELEMENT_NODE) {
          if (child.tagName === 'IMG' && child.classList.contains('inline-emoji')) {
            const i = document.createElement('img');
            i.src = child.src; i.alt = child.alt; i.className = 'inline-emoji';
            frag.appendChild(i);
          } else if (child.tagName === 'BR') {
            frag.appendChild(document.createElement('br'));
          } else if (child.classList && child.classList.contains('c-mention')) {
            const sp = document.createElement('span');
            sp.className = 'c-mention';
            sp.textContent = child.textContent;
            frag.appendChild(sp);
          } else {
            frag.appendChild(sanitize(child));
          }
        }
      });
      const w = document.createElement('div');
      w.appendChild(frag);
      return w;
    }

    function highlightMentions(html) {
      const div = document.createElement('div');
      div.innerHTML = html;
      (function walk(node) {
        if (node.nodeType === Node.TEXT_NODE) {
          if (node.textContent.includes('@')) {
            const span = document.createElement('span');
            span.innerHTML = node.textContent.replace(/@(\w+)/g, '<span class="c-mention">@$1</span>');
            node.replaceWith(span);
          }
        } else {
          Array.from(node.childNodes).forEach(walk);
        }
      })(div);
      return div.innerHTML;
    }

    // ── SVG / icon builders ────────────────────────────────────────────────────
    const SVG_REPLY = `<img src="assets/replay_ic.png" width="14" height="14" style="object-fit:contain;opacity:0.7;vertical-align:middle;" />`;
    const SVG_EDIT = `<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1.33"><path d="M11.33 2.67a1.88 1.88 0 0 1 2.67 2.67L4.67 14.67l-3.34.67.67-3.34z" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    const IC_LIKE = (size) => `<img class="c-like-icon" src="assets/like_ic.png" width="${size}" height="${size}" />`;

    // ── Build reply element ────────────────────────────────────────────────────
    function buildReplyEl(html, isOwn) {
      const id = 'ri' + (++idSeq);
      const el = document.createElement('div');
      el.className = 'reply-item';
      el.dataset.id = id;
      el.dataset.own = isOwn ? '1' : '0';
      el.innerHTML = `
        <div class="reply-avatar" style="background:${isOwn ? ME.color : COLORS[idSeq % COLORS.length]}">${isOwn ? ME.initials : 'U'}</div>
        <div class="reply-body">
          <div class="reply-header">
            <span class="reply-name">${isOwn ? ME.name : 'User'}</span>
            <span class="reply-time">1s</span>
          </div>
          <div class="reply-text">${highlightMentions(html)}</div>
          <div class="reply-actions">
            <button class="c-action-btn" onclick="startReply(this, true)">${SVG_REPLY} Reply</button>
            ${isOwn ? `<button class="c-action-btn" onclick="startEdit(this, true)">${SVG_EDIT} Edit</button>` : ''}
          </div>
        </div>
        <div class="reply-right">
          <button class="reply-like-btn c-like-btn" onclick="toggleLike(this)">${IC_LIKE(18)}</button>
          <span class="reply-like-count" data-count="0">0</span>
        </div>`;
      bindLongPress(el);
      return el;
    }

    // ── Build comment element ──────────────────────────────────────────────────
    function buildCommentEl(html, isOwn) {
      const id = 'ci' + (++idSeq);
      const el = document.createElement('div');
      el.className = 'comment-item';
      el.dataset.id = id;
      el.dataset.own = isOwn ? '1' : '0';
      el.innerHTML = `
        <div class="c-avatar" style="background:${isOwn ? ME.color : COLORS[idSeq % COLORS.length]}">${isOwn ? ME.initials : 'U'}</div>
        <div class="c-body">
          <div class="c-row">
            <div class="c-left">
              <div class="c-header">
                <span class="c-name">${isOwn ? ME.name : 'User'}</span>
                <span class="c-time">1s</span>
              </div>
              <div class="c-text">${highlightMentions(html)}</div>
              <div class="c-actions">
                <button class="c-action-btn" onclick="startReply(this, false)">${SVG_REPLY} Reply</button>
                ${isOwn ? `<button class="c-action-btn" onclick="startEdit(this, false)">${SVG_EDIT} Edit</button>` : ''}
                <span class="c-replies-label" style="display:none"></span>
              </div>
            </div>
            <div class="c-right">
              <button class="c-like-btn" onclick="toggleLike(this)">${IC_LIKE(22)}</button>
              <span class="c-like-count" data-count="0">0</span>
            </div>
          </div>
          <div class="reply-thread"></div>
        </div>`;
      bindLongPress(el);
      return el;
    }

    // ── Reply ──────────────────────────────────────────────────────────────────
    function startReply(btn, fromReply) {
      const commentEl = btn.closest('.comment-item');
      const nameSrc = fromReply
        ? btn.closest('.reply-item').querySelector('.reply-name').textContent
        : commentEl.querySelector('.c-name').textContent;

      replyingTo = { commentEl };
      editor.setAttribute('data-placeholder', 'Replying to @' + nameSrc.replace(/\s+/g, '') + '...');
      editor.focus();

      if (fromReply) {
        const mention = document.createElement('span');
        mention.className = 'c-mention';
        mention.contentEditable = 'false';
        mention.textContent = '@' + nameSrc.replace(/\s+/g, '');
        editor.innerHTML = '';
        editor.appendChild(mention);
        editor.appendChild(document.createTextNode(' '));
        const range = document.createRange();
        range.selectNodeContents(editor);
        range.collapse(false);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        syncSendBtn();
      }
    }

    function cancelReply() {
      replyingTo = null;
      editor.setAttribute('data-placeholder', 'Add a response...');
    }

    // ── Edit ───────────────────────────────────────────────────────────────────
    function startEdit(btn, isReply) {
      const item = btn.closest(isReply ? '.reply-item' : '.comment-item');
      const textEl = item.querySelector(isReply ? '.reply-text' : '.c-text');
      editingTextEl = textEl;
      editor.innerHTML = textEl.innerHTML;
      editor.setAttribute('data-placeholder', 'Edit response...');
      document.getElementById('sendIcon').src = 'assets/save_ic_edit.png';
      editor.focus();
      const range = document.createRange();
      range.selectNodeContents(editor);
      range.collapse(false);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      syncSendBtn();
    }

    // ── Submit ─────────────────────────────────────────────────────────────────
    function submitComment() {
      const hasText = editor.innerText.trim().length > 0;
      const hasEmoji = !!editor.querySelector('img.inline-emoji');
      if (!hasText && !hasEmoji) return;

      const clean = sanitize(editor).innerHTML;

      if (editingTextEl) {
        editingTextEl.innerHTML = highlightMentions(clean);
        editingTextEl = null;
        editor.innerHTML = '';
        editor.setAttribute('data-placeholder', 'Add a response...');
        document.getElementById('sendIcon').src = 'assets/comment_send_img.png';
        syncSendBtn();
        cancelReply();
        return;
      }

      if (replyingTo) {
        const { commentEl } = replyingTo;
        const thread = commentEl.querySelector('.reply-thread');
        const replyEl = buildReplyEl(clean, true);
        thread.appendChild(replyEl);

        const label = commentEl.querySelector('.c-replies-label');
        const cnt = thread.querySelectorAll('.reply-item').length;
        label.style.display = '';
        label.textContent = cnt + (cnt === 1 ? ' Reply' : ' Replies');

        cancelReply();
        replyEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      } else {
        emptyState.style.display = 'none';
        const el = buildCommentEl(clean, true);
        commentList.appendChild(el);
        updateCount();
        // Scroll to bottom so new comment is visible
        requestAnimationFrame(() => {
          commentList.scrollTop = commentList.scrollHeight;
        });
      }

      editor.innerHTML = '';
      editor.setAttribute('data-placeholder', 'Add a response...');
      syncSendBtn();
      editor.focus();
    }

    // ── Like toggle ────────────────────────────────────────────────────────────
    function toggleLike(btn) {
      const isLiked = btn.classList.toggle('liked');
      const icon = btn.querySelector('.c-like-icon');
      const isReply = !!btn.closest('.reply-item');
      const parent = btn.closest(isReply ? '.reply-right' : '.c-right');
      const countEl = parent.querySelector(isReply ? '.reply-like-count' : '.c-like-count');
      let count = parseInt(countEl.dataset.count, 10);

      if (isLiked) {
        count++;
        icon.src = 'assets/like_fill_ic.svg';
        btn.classList.add('animating');
        setTimeout(() => btn.classList.remove('animating'), 300);
      } else {
        count--;
        icon.src = 'assets/like_ic.png';
      }

      countEl.dataset.count = count;
      countEl.textContent = count;
    }

    // ── Context menu ───────────────────────────────────────────────────────────
    function bindLongPress(el) {
      let timer = null;
      function onStart(e) { timer = setTimeout(() => showCtxMenu(e, el), 420); }
      function onEnd() { clearTimeout(timer); timer = null; }

      el.addEventListener('touchstart', onStart, { passive: true });
      el.addEventListener('touchend', onEnd);
      el.addEventListener('touchcancel', onEnd);
      el.addEventListener('touchmove', onEnd);
      el.addEventListener('contextmenu', e => { e.preventDefault(); showCtxMenu(e, el); });
    }

    function showCtxMenu(e, el) {
      closeCtxMenu();
      const isOwn = el.dataset.own === '1';
      const isReply = el.classList.contains('reply-item');
      const id = el.dataset.id;

      const overlay = document.createElement('div');
      overlay.className = 'ctx-overlay';
      overlay.onclick = closeCtxMenu;

      const menu = document.createElement('div');
      menu.className = 'ctx-menu';
      menu.id = 'ctxMenu';

      if (isOwn) {
        const del = document.createElement('button');
        del.className = 'ctx-item';
        del.innerHTML = `<img src="assets/ic_delete.png" width="18" height="18" style="object-fit:contain;flex-shrink:0;" /> <span style="color:#FFFFFF">Delete</span>`;
        del.onclick = () => deleteItem(id, isReply);
        menu.appendChild(del);
      }

      const rep = document.createElement('button');
      rep.className = 'ctx-item';
      rep.innerHTML = `<img src="assets/ic_report.png" width="18" height="18" style="object-fit:contain;flex-shrink:0;" /> <span style="color:#EA1C25">Report</span>`;
      rep.onclick = () => { closeCtxMenu(); showToast('Response reported'); };
      menu.appendChild(rep);

      document.body.appendChild(overlay);
      document.body.appendChild(menu);

      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;
      const mw = menu.offsetWidth || 180;
      const mh = menu.offsetHeight || 112;
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      menu.style.left = Math.min(cx, vw - mw - 16) + 'px';
      menu.style.top = Math.min(cy, vh - mh - 16) + 'px';
    }

    function closeCtxMenu() {
      document.getElementById('ctxMenu')?.remove();
      document.querySelectorAll('.ctx-overlay').forEach(o => o.remove());
    }

    function deleteItem(id, isReply) {
      closeCtxMenu();
      if (isReply) {
        const el = document.querySelector(`.reply-item[data-id="${id}"]`);
        if (!el) return;
        const commentEl = el.closest('.comment-item');
        el.remove();
        const thread = commentEl.querySelector('.reply-thread');
        const label = commentEl.querySelector('.c-replies-label');
        const cnt = thread.querySelectorAll('.reply-item').length;
        label.style.display = cnt ? '' : 'none';
        if (cnt) label.textContent = cnt + (cnt === 1 ? ' Reply' : ' Replies');
      } else {
        document.querySelector(`.comment-item[data-id="${id}"]`)?.remove();
        updateCount();
        if (!commentList.querySelector('.comment-item')) {
          emptyState.style.display = '';
        }
      }
      showToast('Response deleted');
    }

    // ── @mention autocomplete ──────────────────────────────────────────────────
    function getMentionQuery() {
      const sel = window.getSelection();
      if (!sel || sel.rangeCount === 0) return null;
      const range = sel.getRangeAt(0);
      const node = range.startContainer;
      if (node.nodeType !== Node.TEXT_NODE) return null;
      const text = node.textContent.slice(0, range.startOffset);
      const match = text.match(/@(\w*)$/);
      return match ? match[1] : null;
    }

    function positionMentionPopup() {
      const emojiBar = document.querySelector('.emoji-bar');
      const rect = emojiBar.getBoundingClientRect();
      mentionPopup.style.bottom = (window.innerHeight - rect.top + 6) + 'px';
    }

    function showMentionPopup(query) {
      const list = MENTION_USERS.filter(u =>
        u.name.toLowerCase().includes(query.toLowerCase()) ||
        u.username.toLowerCase().includes(query.toLowerCase())
      );
      if (!list.length) { hideMentionPopup(); return; }

      positionMentionPopup();
      mentionPopup.innerHTML = list.map(u => `
        <button class="mention-item" onclick="insertMention('${u.name.replace(/'/g, "\\'")}','${u.username}')">
          <div class="mention-av" style="background:${u.color}">${u.initials}</div>
          <div class="mention-info">
            <span class="mention-name">${u.name}</span>
            <span class="mention-uname">${u.username}</span>
          </div>
        </button>`).join('');
      mentionPopup.style.display = 'flex';
    }

    function hideMentionPopup() { mentionPopup.style.display = 'none'; }

    function insertMention(name, username) {
      const sel = window.getSelection();
      if (!sel || sel.rangeCount === 0) { hideMentionPopup(); return; }
      const range = sel.getRangeAt(0);
      const node = range.startContainer;
      if (node.nodeType !== Node.TEXT_NODE) { hideMentionPopup(); return; }

      const offset = range.startOffset;
      const text = node.textContent;
      const atIdx = text.slice(0, offset).lastIndexOf('@');

      const mention = document.createElement('span');
      mention.className = 'c-mention';
      mention.contentEditable = 'false';
      mention.textContent = '@' + username;

      const before = document.createTextNode(text.slice(0, atIdx));
      const after = document.createTextNode(' ' + text.slice(offset));
      node.parentNode.insertBefore(before, node);
      node.parentNode.insertBefore(mention, node);
      node.parentNode.insertBefore(after, node);
      node.remove();

      const nr = document.createRange();
      nr.setStart(after, 1);
      nr.collapse(true);
      sel.removeAllRanges();
      sel.addRange(nr);

      hideMentionPopup();
      syncSendBtn();
    }

    // ── Editor events ──────────────────────────────────────────────────────────
    editor.addEventListener('input', () => {
      syncSendBtn();
      const q = getMentionQuery();
      q !== null ? showMentionPopup(q) : hideMentionPopup();
    });

    editor.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (mentionPopup.style.display === 'flex') {
          mentionPopup.querySelector('.mention-item')?.click();
          return;
        }
        submitComment();
      }
      if (e.key === 'Escape') { hideMentionPopup(); cancelReply(); }
    });

    editor.addEventListener('blur', () => setTimeout(hideMentionPopup, 150));

    commentList.addEventListener('scroll', closeCtxMenu);

    // ── Drag handle — snap-back dismiss gesture ────────────────────────────────
    let dragStartY = 0;
    let dragCurrentY = 0;
    let isDragging = false;

    dragHandle.addEventListener('touchstart', e => {
      dragStartY = e.touches[0].clientY;
      isDragging = true;
      commentModal.style.transition = 'none';
    }, { passive: true });

    window.addEventListener('touchmove', e => {
      if (!isDragging) return;
      dragCurrentY = e.touches[0].clientY;
      const delta = dragCurrentY - dragStartY;
      if (delta > 0) {
        commentModal.style.transform = `translateX(-50%) translateY(${delta}px)`;
      }
    }, { passive: true });

    window.addEventListener('touchend', () => {
      if (!isDragging) return;
      isDragging = false;

      const delta = dragCurrentY - dragStartY;
      commentModal.style.transition = 'transform 0.28s cubic-bezier(0.22, 1, 0.36, 1)';

      if (delta > 160) {
        // Dismiss → snap back after short pause (prototype: no real navigation)
        commentModal.style.transform = `translateX(-50%) translateY(100%)`;
        setTimeout(() => {
          commentModal.style.transition = 'none';
          commentModal.style.transform = 'translateX(-50%) translateY(0)';
          requestAnimationFrame(() => {
            commentModal.style.transition = 'transform 0.28s cubic-bezier(0.22, 1, 0.36, 1)';
          });
        }, 400);
      } else {
        commentModal.style.transform = 'translateX(-50%) translateY(0)';
      }
    });
  </script>
</body>

</html>
