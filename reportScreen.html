<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Report Screen</title>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      background: #242424;
      font-family: 'DM Sans', sans-serif;
      display: flex;
      justify-content: center;
    }

    .phone {
      width: 100%;
      max-width: 420px;
      height: 100%;
      background: #242424;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Top bar ───────────────────────────────────────────────── */
    .top-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 54px 16px 16px;
      flex-shrink: 0;
    }

.report-icon {
      width: 32px;
      height: 32px;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      flex-shrink: 0;
    }

    .report-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .report-title {
      font-size: 18px;
      font-weight: 500;
      line-height: 24px;
      color: #FFFFFF;
    }

    /* ── Divider ───────────────────────────────────────────────── */
    .divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
      flex-shrink: 0;
      margin: 0 16px;
    }

    /* ── Body ──────────────────────────────────────────────────── */
    .report-body {
      flex: 1;
      overflow-y: auto;
      padding: 22px 16px 24px;
      display: flex;
      flex-direction: column;
    }

    .report-body::-webkit-scrollbar {
      display: none;
    }

    .report-label {
      font-size: 16px;
      font-weight: 400;
      line-height: 21px;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 18px;
    }

    .report-options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .report-option {
      width: 100%;
      height: 50px;
      border-radius: 5px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1C1C1E;
      color: #FFFFFF;
      font-size: 16px;
      font-weight: 400;
      line-height: 22.5px;
      border: none;
      cursor: pointer;
      transition: 0.2s ease;
      font-family: 'DM Sans', sans-serif;
    }

    .report-option.active {
      background: #EA1C25;
    }

    .report-option svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    /* ── Bottom actions ────────────────────────────────────────── */
    .bottom-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 16px calc(24px + env(safe-area-inset-bottom, 0px));
      flex-shrink: 0;
    }

    .btn-cancel {
      width: 173px;
      height: 38px;
      flex-shrink: 0;
      border-radius: 5px;
      padding: 10px;
      gap: 10px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: #0C0C0F;
      color: #FFFFFF;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: 0.2s ease;
    }

    .btn-submit {
      width: 175px;
      height: 38px;
      flex-shrink: 0;
      border-radius: 5px;
      padding: 10px;
      gap: 10px;
      border: none;
      background: #EA1C25;
      color: #FFFFFF;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: 0.2s ease;
    }
  </style>
</head>

<body>

  <div class="phone">

    <div class="top-bar">
<div class="report-icon">
        <img src="assets/ic_report.png" alt="Report" />
      </div>
      <div class="report-title">Report</div>
    </div>

    <div class="divider"></div>

    <div class="report-body">
      <div class="report-label">Please select a reason for reporting:</div>

      <div class="report-options" id="reportOptions">
        <button class="report-option active" onclick="selectOption(this)">
          <span>Bullying or unwanted contact</span>
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M20 6L9 17L4 12" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button class="report-option" onclick="selectOption(this)">
          <span>Nudity or sexual activity</span>
        </button>
        <button class="report-option" onclick="selectOption(this)">
          <span>Hate speech or symbols</span>
        </button>
        <button class="report-option" onclick="selectOption(this)">
          <span>Violence or exploration</span>
        </button>
        <button class="report-option" onclick="selectOption(this)">
          <span>Scam, fraud or spam</span>
        </button>
        <button class="report-option" onclick="selectOption(this)">
          <span>False information</span>
        </button>
      </div>
    </div>

    <div class="bottom-actions">
      <button class="btn btn-cancel" onclick="history.back()">Cancel</button>
      <button class="btn btn-submit" onclick="history.back()">Submit</button>
    </div>

  </div>

  <script>
    function selectOption(btn) {
      document.querySelectorAll('#reportOptions .report-option').forEach(o => {
        o.classList.remove('active');
        o.querySelector('svg')?.remove();
      });
      btn.classList.add('active');
      btn.insertAdjacentHTML('beforeend', `<svg viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17L4 12" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`);
    }
  </script>

</body>

</html>
