<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1A1A1A">
    <title>Create</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body {
            width: 100%; height: 100dvh;
            background: #111;
            font-family: 'DM Sans', sans-serif;
            overflow: hidden;
        }

        body { display: flex; justify-content: center; align-items: center; }

        .app {
            position: relative;
            width: 100%;
            max-width: 420px;
            height: 100dvh;
            overflow: hidden;
            background: #1A1A1A;
            color: #fff;
            display: flex;
            flex-direction: column;
        }

        /* ── STATUS BAR ─────────────────────────────── */
        .status-bar {
            flex-shrink: 0;
            height: 44px;
            padding: 0 20px 10px;
            padding-top: env(safe-area-inset-top, 0px);
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            background: #1A1A1A;
            z-index: 10;
        }

        .time { font-size: 15px; font-weight: 700; letter-spacing: .2px; }

        .status-icons { display: flex; align-items: center; gap: 6px; }

        .signal { display: flex; align-items: flex-end; gap: 2px; }
        .signal span { width: 3px; background: #fff; border-radius: 2px; }
        .signal span:nth-child(1) { height: 5px; opacity: .55; }
        .signal span:nth-child(2) { height: 7px; opacity: .70; }
        .signal span:nth-child(3) { height: 9px; opacity: .85; }
        .signal span:nth-child(4) { height: 11px; }

        .wifi {
            width: 14px; height: 10px;
            border: 2px solid #fff;
            border-top: none;
            border-left-color: transparent; border-right-color: transparent;
            border-bottom-left-radius: 20px; border-bottom-right-radius: 20px;
            transform: rotate(180deg);
            opacity: .9;
        }

        .battery {
            width: 23px; height: 11px;
            border: 1.5px solid rgba(255,255,255,.8);
            border-radius: 3px;
            position: relative;
        }
        .battery::before {
            content: "";
            position: absolute;
            width: 2px; height: 4px;
            background: #fff;
            right: -4px; top: 2.5px;
            border-radius: 1px;
        }
        .battery::after {
            content: "";
            position: absolute;
            inset: 2px;
            background: #fff;
            border-radius: 1px;
        }

        /* ── CONTENT ─────────────────────────────────── */
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding-bottom: 80px; /* offset for nav bar height */
        }

        .cs-icon {
            width: 64px;
            height: 64px;
            opacity: 0.18;
        }

        .cs-title {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.3px;
        }

        .cs-sub {
            font-size: 14px;
            font-weight: 400;
            color: rgba(255,255,255,0.4);
            text-align: center;
            line-height: 1.5;
            max-width: 220px;
        }

        /* ── BOTTOM NAV ──────────────────────────────── */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 420px;
            background: rgba(18, 18, 18, 0.97);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.08);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 10px 0 calc(10px + env(safe-area-inset-bottom, 0px));
            z-index: 50;
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
            padding: 4px 0 2px;
            gap: 5px;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.15s ease;
            min-height: 48px;
        }

        .nav-item:active { transform: scale(0.88); }

        .nav-item .icon-outline,
        .nav-item .icon-filled {
            width: 26px;
            height: 26px;
            object-fit: contain;
            display: block;
        }

        a[href="createScreen.html"] .icon-outline,
        a[href="createScreen.html"] .icon-filled {
            width: 36px;
            height: 36px;
        }

        .nav-item .icon-outline { opacity: 0.4; }
        .nav-item .icon-filled  { display: none; }

        .nav-item.active .icon-outline { display: none; }
        .nav-item.active .icon-filled  { display: block; }

        .nav-avatar {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            overflow: hidden;
            border: 1.5px solid rgba(255,255,255,0.35);
            opacity: 0.45;
            transition: opacity 0.2s, border-color 0.2s;
        }

        .nav-item.active .nav-avatar {
            opacity: 1;
            border-color: #EA1C25;
        }

        .nav-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
    </style>
</head>

<body>
<div class="app">

    <!-- STATUS BAR -->
    <div class="status-bar">
        <div class="time">9:41</div>
        <div class="status-icons">
            <div class="signal">
                <span></span><span></span><span></span><span></span>
            </div>
            <div class="wifi"></div>
            <div class="battery"></div>
        </div>
    </div>

    <!-- CONTENT -->
    <div class="content">
        <img class="cs-icon" src="assets/create_filled_ic.png" alt="">
        <div class="cs-title">Coming Soon</div>
        <div class="cs-sub">Create features are on their way. Stay tuned.</div>
    </div>

    <!-- BOTTOM NAV -->
    <div class="nav-bar">
        <a href="homeScreen.html" class="nav-item">
            <img class="icon-outline" src="assets/home_ic.png" alt="Home">
            <img class="icon-filled" src="assets/home_filled_ic.png" alt="Home">
        </a>
        <a href="searchScreen.html" class="nav-item">
            <img class="icon-outline" src="assets/search_ic.png" alt="Search">
            <img class="icon-filled" src="assets/search_filled_ic.png" alt="Search">
        </a>
        <div class="nav-item active">
            <img class="icon-outline" src="assets/create_ic.png" alt="Create">
            <img class="icon-filled" src="assets/create_filled_ic.png" alt="Create">
        </div>
        <a href="userProfileScreen.html" class="nav-item">
            <div class="nav-avatar">
                <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?q=80&w=400" alt="Profile">
            </div>
        </a>
    </div>

</div>
</body>
</html>
